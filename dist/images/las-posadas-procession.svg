<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">Las Posadas Procession</title>
  <desc id="desc">Illustration of a starry evening procession with luminarias, a stylized donkey, and adobe homes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a6b" />
      <stop offset="60%" stop-color="#2e4c9a" />
      <stop offset="100%" stop-color="#5c7dd8" />
    </linearGradient>
    <radialGradient id="street" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#f7c778" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#402818" stop-opacity="1" />
    </radialGradient>
  </defs>

  <rect width="512" height="320" fill="url(#sky)" />

  <!-- Star -->
  <g fill="#ffd75f" transform="translate(420 50)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" />
  </g>

  <!-- Hills -->
  <path d="M0 180 Q120 140 220 180 T512 175 V320 H0 Z" fill="#16224b" opacity="0.6" />

  <!-- Houses -->
  <g fill="#f4e0c5" stroke="#c6a376" stroke-width="3">
    <rect x="40" y="150" width="100" height="70" rx="6" />
    <rect x="170" y="140" width="110" height="80" rx="6" />
    <rect x="310" y="155" width="90" height="70" rx="6" />
  </g>
  <g fill="#c67c3d">
    <rect x="70" y="190" width="30" height="30" />
    <rect x="205" y="185" width="35" height="35" />
    <rect x="340" y="195" width="30" height="30" />
  </g>

  <!-- Luminarias -->
  <g fill="#ffb347" stroke="#fce5c5" stroke-width="2">
    <rect x="60" y="230" width="18" height="26" rx="3" />
    <rect x="120" y="240" width="18" height="26" rx="3" />
    <rect x="190" y="235" width="18" height="26" rx="3" />
    <rect x="260" y="242" width="18" height="26" rx="3" />
    <rect x="330" y="236" width="18" height="26" rx="3" />
    <rect x="400" y="243" width="18" height="26" rx="3" />
  </g>

  <!-- Street -->
  <path d="M0 250 Q140 230 256 300 T512 295 V320 H0 Z" fill="url(#street)" />

  <!-- Procession silhouettes -->
  <g fill="#1c1030">
    <circle cx="120" cy="225" r="18" />
    <rect x="108" y="225" width="24" height="40" rx="6" />
    <circle cx="190" cy="215" r="16" />
    <rect x="180" y="215" width="20" height="45" rx="5" />
  </g>

  <!-- Donkey -->
  <g fill="#332547">
    <rect x="240" y="230" width="60" height="40" rx="8" />
    <rect x="230" y="240" width="15" height="35" rx="5" />
    <rect x="285" y="240" width="15" height="35" rx="5" />
    <polygon points="242,230 228,208 240,210 250,226" />
    <polygon points="300,230 315,205 308,234" />
    <circle cx="295" cy="222" r="9" />
    <rect x="288" y="222" width="8" height="8" rx="2" fill="#ffd75f" />
  </g>

  <!-- Lantern -->
  <g transform="translate(350 210)">
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#fef2c7" stroke-width="3" />
    <rect x="-8" y="0" width="16" height="26" rx="4" fill="#ffe68c" stroke="#f7b733" stroke-width="3" />
  </g>
</svg>
