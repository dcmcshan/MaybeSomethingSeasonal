name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install external RFC 5545 validators
        run: python -m pip install --disable-pip-version-check icalendar==7.3.0 recurring-ical-events==3.8.2

      - name: Expand recurrences with external parser
        run: python scripts/validate-rfc5545.py

      - name: Verify calendar artifact
        run: |
          test -s dist/MSS.ics
          grep -q '^BEGIN:VCALENDAR' dist/MSS.ics
          grep -q '^END:VCALENDAR' dist/MSS.ics

      - name: Upload MSS calendar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mss-calendar
          path: dist/MSS.ics
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  publish-cal:
    name: Publish MSS.ics to Cal
    runs-on: ubuntu-latest
    needs: build
    env:
      CAL_REPO_TOKEN: ${{ secrets.CAL_REPO_TOKEN }}
    steps:
      - name: Download MSS calendar artifact
        uses: actions/download-artifact@v4
        with:
          name: mss-calendar
          path: mss-calendar

      - name: Cal mirror not configured
        if: env.CAL_REPO_TOKEN == ''
        run: echo "CAL_REPO_TOKEN is not configured; GitHub Pages remains the authoritative MSS.ics subscription endpoint."

      - name: Checkout Cal
        if: env.CAL_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: CastaliaInstitute/cal.inquiry.institute
          ref: main
          token: ${{ env.CAL_REPO_TOKEN }}
          path: cal

      - name: Update Cal static calendar
        if: env.CAL_REPO_TOKEN != ''
        run: |
          cp mss-calendar/MSS.ics cal/www/MSS.ics
          cd cal
          if git diff --quiet -- www/MSS.ics; then
            echo "Cal already has the current MSS.ics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- www/MSS.ics
          git commit -m "Update MSS subscription calendar"
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
