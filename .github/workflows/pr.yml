name: Validate pull request

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'feature/**' ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate source ICS
        run: npm run validate

      - name: Build and validate subscription ICS
        run: npm run build

      - name: Install external RFC 5545 validators
        run: python -m pip install --disable-pip-version-check icalendar==7.3.0 recurring-ical-events==3.8.2

      - name: Expand recurrences with external parser
        run: python scripts/validate-rfc5545.py
