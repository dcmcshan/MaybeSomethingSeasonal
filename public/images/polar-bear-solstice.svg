<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Polar bear greeting the winter solstice</title>
  <desc id="desc">Stylized polar bear standing on twilight ice with aurora sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#164262" />
      <stop offset="100%" stop-color="#0b1b2b" />
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cfef0" stop-opacity="0" />
      <stop offset="40%" stop-color="#8ef9c0" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#7dc7ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4c8bff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4f4ff" />
      <stop offset="100%" stop-color="#b8d7f4" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)" />
  <path d="M0 190 Q140 120 260 170 T520 150 Q650 130 800 180 V600 H0 Z" fill="url(#aurora)" opacity="0.75" />
  <circle cx="640" cy="130" r="70" fill="#fef5d7" opacity="0.85" filter="url(#softGlow)" />
  <path d="M0 360 Q130 330 260 360 T520 340 Q650 320 800 360 V600 H0 Z" fill="url(#ice)" />
  <path d="M0 430 Q150 410 280 430 T560 420 Q700 410 800 430 V600 H0 Z" fill="#d2e8fd" opacity="0.9" />
  <g id="polarBear" transform="translate(180 300)">
    <path d="M40 110 Q25 70 40 40 Q65 0 150 10 Q230 20 280 80 T350 180 Q270 210 160 200 Q70 190 40 110" fill="#f7fbff" stroke="#dbe5f4" stroke-width="3" />
    <ellipse cx="140" cy="65" rx="75" ry="45" fill="#fdfefe" stroke="#dbe5f4" stroke-width="3" />
    <ellipse cx="315" cy="140" rx="65" ry="50" fill="#fdfefe" stroke="#dbe5f4" stroke-width="3" />
    <circle cx="318" cy="118" r="12" fill="#1f2933" />
    <path d="M318 118 q-5 6 -1 12" stroke="#fdfefe" stroke-width="3" stroke-linecap="round" />
    <circle cx="342" cy="108" r="5" fill="#1f2933" />
    <circle cx="328" cy="106" r="5" fill="#1f2933" />
    <path d="M160 200 q5 35 -5 70" stroke="#d1ddeb" stroke-width="10" stroke-linecap="round" />
    <path d="M220 205 q15 40 5 75" stroke="#d1ddeb" stroke-width="10" stroke-linecap="round" />
    <path d="M80 185 q-10 40 -30 70" stroke="#d1ddeb" stroke-width="10" stroke-linecap="round" />
    <path d="M280 185 q25 45 18 80" stroke="#d1ddeb" stroke-width="10" stroke-linecap="round" />
    <path d="M60 92 q15 -10 35 0" stroke="#c0cfe0" stroke-width="6" stroke-linecap="round" />
    <path d="M120 85 q25 -15 55 -5" stroke="#c0cfe0" stroke-width="6" stroke-linecap="round" />
  </g>
  <g stroke="#d7ecff" stroke-width="2" opacity="0.5">
    <path d="M80 520 q40 -20 80 0" />
    <path d="M200 540 q50 -25 100 -5" />
    <path d="M360 520 q60 -30 120 -10" />
    <path d="M540 540 q40 -15 90 0" />
  </g>
</svg>
