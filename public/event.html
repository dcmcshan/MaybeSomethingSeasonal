<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MSS Event Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: #f6f7fb;
        color: #1f2933;
      }
      body {
        margin: 0;
        padding: 2.5rem 1.5rem 3rem;
      }
      .page {
        max-width: 60rem;
        margin: 0 auto;
      }
      header {
        margin-bottom: 2rem;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.95rem;
        color: #0b7285;
        text-decoration: none;
        font-weight: 600;
      }
      .back-link::before {
        content: "←";
        font-size: 1rem;
      }
      h1 {
        font-size: clamp(1.8rem, 2.6vw, 2.75rem);
        margin: 0.75rem 0 0.5rem;
        color: #0b7285;
      }
      .lead {
        margin: 0;
        color: #475569;
        font-size: clamp(1rem, 1.4vw, 1.15rem);
      }
      .meta {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }
      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: #e0f2fe;
        color: #0f172a;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .meta-pill.icon {
        background: #facc15;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
        padding: 1.75rem clamp(1.25rem, 2vw, 2rem);
        margin-bottom: 1.5rem;
      }
      .card h2 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        color: #0b7285;
      }
      .card p {
        margin: 0 0 0.75rem;
        line-height: 1.6;
        color: #334155;
        white-space: pre-line;
      }
      .card p:last-child {
        margin-bottom: 0;
      }
      figure.event-image {
        background: #0f172a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 25px 55px rgba(15, 23, 42, 0.35);
        margin: 0 0 1.75rem;
      }
      figure.event-image img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 22rem;
        object-fit: cover;
      }
      .share-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1.5rem;
      }
      .share-row button {
        background: #0b7285;
        color: #f8fafc;
        border: none;
        border-radius: 10px;
        padding: 0.6rem 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(11, 114, 133, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .share-row button:hover,
      .share-row button:focus {
        transform: translateY(-1px);
        box-shadow: 0 12px 30px rgba(11, 114, 133, 0.4);
      }
      .share-feedback {
        font-size: 0.9rem;
        color: #0f172a;
      }
      #status {
        margin-top: 1.25rem;
        font-size: 0.95rem;
        color: #64748b;
      }
      .hidden {
        display: none !important;
      }
      .empty-state {
        padding: 2rem;
        border-radius: 14px;
        background: rgba(11, 114, 133, 0.08);
        color: #0f172a;
        font-weight: 600;
      }
      @media (max-width: 640px) {
        body {
          padding: 2rem 1rem 2.25rem;
        }
        .card {
          padding: 1.5rem 1.25rem;
        }
        figure.event-image img {
          max-height: 18rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a href="mss-events.html" class="back-link">All events</a>
        <h1 id="event-title">Loading event…</h1>
        <p id="event-date" class="lead"></p>
        <div class="meta">
          <span id="event-category" class="meta-pill hidden"></span>
          <span id="event-icon" class="meta-pill icon hidden"></span>
        </div>
      </header>

      <main id="event-main" class="hidden" aria-live="polite">
        <figure id="event-image" class="event-image hidden">
          <img src="" alt="" id="event-image-src" />
        </figure>

        <section id="event-overview" class="card hidden">
          <h2>Overview</h2>
          <p id="event-summary"></p>
        </section>

        <section id="history-section" class="card">
          <h2>History</h2>
          <p id="event-history"></p>
        </section>

        <section id="traditions-section" class="card">
          <h2>Traditions</h2>
          <p id="event-traditions"></p>
        </section>

        <section id="feasting-section" class="card">
          <h2>Feasting</h2>
          <p id="event-feasting"></p>
        </section>

        <div class="share-row">
          <button type="button" id="copy-link">Copy share link</button>
          <span id="share-feedback" class="share-feedback" role="status" aria-live="polite"></span>
        </div>
      </main>

      <div id="status" role="status">Fetching event details…</div>
      <div id="empty-state" class="empty-state hidden" role="alert"></div>
    </div>

    <script src="event-detail.js"></script>
  </body>
</html>
