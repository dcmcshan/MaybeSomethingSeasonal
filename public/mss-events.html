<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MSS Calendar Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: #f6f7fb;
        color: #1f2933;
      }
      body {
        margin: 0;
        padding: 2.5rem 1.5rem 3rem;
      }
      header {
        max-width: 75rem;
        margin: 0 auto 2rem;
      }
      h1 {
        font-size: clamp(1.75rem, 2.2vw, 2.5rem);
        margin-bottom: 0.25rem;
        color: #0b7285;
      }
      p.lead {
        margin: 0;
        color: #475569;
        font-size: clamp(1rem, 1.4vw, 1.15rem);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
        align-items: center;
      }
      .controls label {
        font-weight: 600;
        color: #1f2933;
      }
      .controls input {
        padding: 0.45rem 0.65rem;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-size: 0.95rem;
        min-width: 14rem;
      }
      .table-wrapper {
        max-width: 75rem;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      thead {
        background: #0b7285;
        color: #f8fafc;
      }
      th,
      td {
        padding: 0.85rem 1rem;
        text-align: left;
        vertical-align: top;
        font-size: 0.95rem;
      }
      th {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      tbody tr:nth-child(even) {
        background: #f1f5f9;
      }
      tbody tr:nth-child(odd) {
        background: #ffffff;
      }
        tbody tr:hover {
          background: #e0f2fe;
        }
        tbody tr {
          cursor: pointer;
          transition: background 0.2s ease, transform 0.2s ease;
        }
      tbody tr:focus {
        outline: 2px solid #0b7285;
        outline-offset: 2px;
        transform: translateY(-1px);
      }
      td.date {
        white-space: nowrap;
        font-weight: 600;
        color: #0b7285;
      }
      td.weekday {
        white-space: nowrap;
        font-weight: 600;
        color: #2563eb;
      }
      td.image {
        width: 78px;
        padding: 0.5rem;
      }
        td.image .preview {
          width: 64px;
          height: 64px;
          object-fit: cover;
          border-radius: 12px;
          box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
          background: #f1f5f9;
        }
        td.title {
          max-width: 220px;
          font-weight: 600;
          color: #1f2937;
        }
        td.title a {
          color: inherit;
          text-decoration: none;
          border-bottom: 1px solid rgba(37, 99, 235, 0.35);
          transition: color 0.2s ease, border-bottom-color 0.2s ease;
        }
        td.title a:hover,
        td.title a:focus {
          color: #0b7285;
          border-bottom-color: #0b7285;
        }
      td.category {
        font-weight: 600;
        text-transform: capitalize;
        color: #1f2937;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        padding: 0.25rem 0.5rem;
        display: inline-block;
      }
      td.icon {
        font-size: 1.25rem;
      }
      td.snapshot {
        font-size: 0.9rem;
        color: #475569;
      }
      caption {
        text-align: left;
        padding: 1.25rem 1rem;
        font-weight: 600;
        font-size: 1rem;
        color: #475569;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #64748b;
      }
      .hidden {
        display: none !important;
      }
      .event-tooltip {
        position: absolute;
        max-width: 24rem;
        background: rgba(15, 23, 42, 0.95);
        color: #f8fafc;
        padding: 1rem 1.15rem;
        border-radius: 12px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.4);
        z-index: 1000;
        pointer-events: none;
        backdrop-filter: blur(4px);
      }
      .event-tooltip h3 {
        margin: 0 0 0.35rem;
        font-size: 1.05rem;
        font-weight: 600;
      }
      .event-tooltip .tooltip-meta {
        font-size: 0.8rem;
        color: #cbd5f5;
        margin-bottom: 0.6rem;
      }
      .event-tooltip .tooltip-section {
        margin-bottom: 0.5rem;
      }
      .event-tooltip .tooltip-section strong {
        display: inline-block;
        font-size: 0.82rem;
        letter-spacing: 0.01em;
        color: #0f172a;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
        background: rgba(255, 255, 255, 0.9);
        padding: 0.1rem 0.45rem;
        border-radius: 6px;
      }
      .event-tooltip .tooltip-section p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
      }
      .event-tooltip .tooltip-image {
        margin-bottom: 0.75rem;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
      }
      .event-tooltip .tooltip-image img {
        width: 100%;
        height: 160px;
        object-fit: cover;
      }
      .event-tooltip .tooltip-icon {
        font-size: 0.85rem;
        color: #cbd5f5;
        margin-top: 0.4rem;
      }
      @media (max-width: 900px) {
        .table-wrapper {
          overflow-x: auto;
        }
        table {
          min-width: 720px;
        }
      }
      @media (max-width: 640px) {
        body {
          padding: 1.75rem 1rem 2.25rem;
        }
        .controls {
          flex-direction: column;
          align-items: stretch;
        }
        .controls input {
          width: 100%;
        }
        caption {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Maybe Something Seasonal – MSS.ics Index</h1>
      <p class="lead">
        This page lists every event currently published in <code>MSS.ics</code>
        so you can review titles, dates, icons, categories, and descriptions at a
        glance.
      </p>
      <div class="controls">
        <label for="search">Filter events</label>
        <input
          id="search"
          type="search"
          placeholder="Search by title, date, category, or description…"
          aria-label="Search events"
        />
        <span id="status" role="status">Loading events…</span>
      </div>
    </header>

    <div class="table-wrapper hidden" id="table-container">
      <table>
        <caption id="table-caption">Calendar Events</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Day</th>
            <th scope="col">Image</th>
            <th scope="col">Title</th>
            <th scope="col">Category</th>
            <th scope="col">Icon</th>
            <th scope="col">Snapshot</th>
          </tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </div>

    <template id="row-template">
      <tr>
        <td class="date"></td>
        <td class="weekday"></td>
        <td class="image"></td>
        <td class="title"></td>
        <td class="category"></td>
        <td class="icon"></td>
        <td class="snapshot"></td>
      </tr>
    </template>

    <script src="mss-events.js"></script>

  </body>
</html>
